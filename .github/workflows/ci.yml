name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bug_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bug_tracker_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bug_tracker_test
      COMPANY_EMAIL_DOMAIN: fulcrumdigital.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database tables
        run: |
          python -c "from app.db.init_db import create_tables; create_tables(); print('Tables created successfully')"

      - name: Run tests
        run: |
          python -m pytest -v